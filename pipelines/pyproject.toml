[project]
name = "happygut-pipelines"
version = "0.1.0"
description = "HappyGut knowledge pipelines: seed loading and validation, knowledge build."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "happygut-engine"]

[tool.uv.sources]
happygut-engine = { path = "../engine", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/happygut_pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
