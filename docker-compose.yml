# Services that run on the team GPU machine: AMD Radeon RX 7700 XT (12 GB, ROCm) on Ubuntu.
# Everything binds to localhost; only the gateway is published, through Tailscale Funnel:
#   tailscale funnel 8080
# Requires Docker Engine on Ubuntu with the amdgpu kernel driver loaded (the Ollama ROCm image brings its own ROCm runtime).
# Your user must be in the video and render groups:  sudo usermod -aG video,render $USER

services:
  ollama:
    image: ollama/ollama:rocm
    restart: unless-stopped
    environment:
      OLLAMA_MAX_LOADED_MODELS: "3"   # gemma3:4b + llama3.2:3b + bge-m3 stay loaded
      # HSA_OVERRIDE_GFX_VERSION: "11.0.0"   # only if Ollama logs say the GPU is unsupported
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    devices:
      - /dev/kfd
      - /dev/dri

  gateway:
    image: caddy:2
    restart: unless-stopped
    environment:
      GATEWAY_KEY: ${GATEWAY_KEY:?set GATEWAY_KEY in .env}
    volumes:
      - ./services/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - ollama

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: Asia/Dhaka
      TZ: Asia/Dhaka
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
    volumes:
      - n8n:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"

  # Added in Step 1 (knowledge layer):
  # embed:  bge-reranker-v2-m3 on CPU (services/embed); BGE-M3 embeddings are served by Ollama
  # mcp:    FastMCP servers (services/mcp)

volumes:
  ollama:
  n8n:
