# Services that run on the team GPU machine (12 GB VRAM).
# Everything binds to localhost; only the gateway is published, through Tailscale Funnel:
#   tailscale funnel 8080
# Requires Docker with NVIDIA GPU support (Docker Desktop + WSL2 on Windows, nvidia-container-toolkit on Linux).

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  gateway:
    image: caddy:2
    restart: unless-stopped
    environment:
      GATEWAY_KEY: ${GATEWAY_KEY:?set GATEWAY_KEY in .env}
    volumes:
      - ./services/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - ollama

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: Asia/Dhaka
      TZ: Asia/Dhaka
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
    volumes:
      - n8n:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"

  # Added in Step 1 (knowledge layer):
  # embed:  BGE-M3 + bge-reranker service (services/embed)
  # mcp:    FastMCP servers (services/mcp)

volumes:
  ollama:
  n8n:
