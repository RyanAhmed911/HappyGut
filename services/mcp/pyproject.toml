[project]
name = "happygut-mcp"
version = "0.1.0"
description = "HappyGut MCP servers (read-only): foodgraph, guidelines, journal, evals, research."
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3", "happygut-pipelines", "happygut-engine", "uvicorn>=0.30"]

[project.optional-dependencies]
neo4j = ["neo4j>=5"]

[tool.uv.sources]
happygut-pipelines = { path = "../../pipelines", editable = true }
happygut-engine = { path = "../../engine", editable = true }

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "httpx>=0.27"]

[project.scripts]
happygut-foodgraph = "happygut_mcp.foodgraph:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/happygut_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
