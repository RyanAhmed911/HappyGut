id: RC-STRICT-003
title_en: "Stricturing Crohn's: care even with small amounts of fibre"
title_bn: "স্ট্রিকচারিং ক্রোনস: অল্প আঁশেও সাবধান"
component: insoluble_fibre
min_level: low
