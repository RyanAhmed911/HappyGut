evidence_level: patient_reported  # guideline | trial | clinical_practice | patient_reported
recommendation_en: "Many people with IBD report that alcohol worsens their gut symptoms; notice how it affects you."
recommendation_bn: "অনেক আইবিডি রোগী জানান অ্যালকোহলে পেটের উপসর্গ বাড়ে; আপনার ক্ষেত্রে কেমন হয় খেয়াল করুন।"
sources:  # quotes are exact sentences from the retrieved text (reference markers omitted); empty quote = identity verified only
