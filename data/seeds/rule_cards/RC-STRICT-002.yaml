id: RC-STRICT-002
title_en: "Stricturing Crohn's: avoid skins, seeds and whole nuts"
title_bn: "স্ট্রিকচারিং ক্রোনস: খোসা, বীজ ও আস্ত বাদাম এড়িয়ে চলুন"
component: skins_seeds_nuts
min_level: low
applies_to:
  diagnosis: [CD]
  phenotype: [stricturing]
  state: [remission, flare]
severity: 3
hard: true
evidence_level: guideline  # guideline | trial | clinical_practice | patient_reported
recommendation_en: "With stricturing Crohn's, avoid skins, seeds and whole nuts, which can be hard to pass through a narrowed bowel."
recommendation_bn: "স্ট্রিকচারিং ক্রোনস থাকলে খোসা, বীজ ও আস্ত বাদাম এড়িয়ে চলুন; সরু হয়ে যাওয়া অন্ত্রে এগুলো আটকে যেতে পারে।"
sources:  # quotes are exact sentences from the retrieved text (reference markers omitted); empty quote = identity verified only
  - key: BARBERIO2025
    citation: "Barberio B, et al. Dietary Interventions and Oral Nutritional Supplementation in Inflammatory Bowel Disease: Current Evidence and Future Directions. Nutrients. 2025."
    doi: "10.3390/nu17111879"
    pmid: "40507145"
    licence: "CC BY 4.0 (open access, Europe PMC)"
    quote: "Traditionally, patients with stricturing disease have been advised to avoid foods with high fiber content, particularly those that maintain their form during intestinal transit, such as raw fruits and vegetables with peels, nuts, seeds, and fibrous vegetables."
  - key: AGA2024
    citation: "Hashash JG, et al. AGA Clinical Practice Update on Diet and Nutritional Therapies in Patients With Inflammatory Bowel Disease: Expert Review. Gastroenterology. 2024."
    doi: "10.1053/j.gastro.2023.11.303"
    pmid: "38276922"
    licence: "Not open access: short quotation from the published abstract; full text not retrieved"
    quote: "Patients with IBD who have symptomatic intestinal strictures may not tolerate fibrous, plant-based foods (ie, raw fruits and vegetables) due to their texture."
  - key: ESPEN2023
    citation: "Bischoff SC, et al. ESPEN guideline on Clinical Nutrition in inflammatory bowel disease. Clin Nutr. 2023."
    doi: "10.1016/j.clnu.2022.12.004"
