id: RC-EMULSIFIERS
title_en: "Limit certain food emulsifiers and thickeners"
title_bn: "কিছু ইমালসিফায়ার ও ঘনকারক কমান"
component: emulsifiers
min_level: low
applies_to:
  diagnosis: [CD, UC]
  phenotype: [any]
  state: [remission, flare]
severity: 1
hard: false
evidence_level: guideline  # guideline | trial | clinical_practice | patient_reported
recommendation_en: "IBD dietary guidance advises limiting processed foods rich in additives such as maltodextrin, emulsifiers and thickeners."
recommendation_bn: "আইবিডির খাদ্য নির্দেশনায় মাল্টোডেক্সট্রিন, ইমালসিফায়ার ও ঘনকারকের মতো উপাদান বেশি থাকা প্রক্রিয়াজাত খাবার কম খাওয়ার পরামর্শ দেওয়া হয়।"
sources:  # quotes are exact sentences from the retrieved text (reference markers omitted); empty quote = identity verified only
