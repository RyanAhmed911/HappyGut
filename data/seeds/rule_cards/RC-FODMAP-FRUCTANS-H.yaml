id: RC-FODMAP-FRUCTANS-H
title_en: "IBS-like symptoms: high fructans (onion, garlic, wheat)"
title_bn: "আইবিএস-ধরনের উপসর্গ: বেশি ফ্রুক্টান (পেঁয়াজ, রসুন, গম)"
component: fructans
min_level: high
