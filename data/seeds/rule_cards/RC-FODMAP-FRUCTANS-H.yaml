evidence_level: trial  # guideline | trial | clinical_practice | patient_reported
recommendation_en: "Onion, garlic and wheat are high in fructans; in quiescent IBD with IBS-like symptoms, a dietitian-guided low-FODMAP approach can relieve gut symptoms."
recommendation_bn: "পেঁয়াজ, রসুন ও গমে ফ্রুক্টান বেশি; রোগ শান্ত থাকা অবস্থায় আইবিএস-ধরনের উপসর্গ থাকলে পুষ্টিবিদের পরামর্শে লো-ফডম্যাপ খাদ্য পেটের উপসর্গ কমাতে পারে।"
sources:  # quotes are exact sentences from the retrieved text (reference markers omitted); empty quote = identity verified only
  - key: COX2020
