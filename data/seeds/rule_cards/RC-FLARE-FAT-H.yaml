id: RC-FLARE-FAT-H
title_en: "Flare: very rich, oily or fried food"
title_bn: "ফ্লেয়ার: খুব তৈলাক্ত বা ভাজা খাবার"
component: fat
min_level: high
applies_to:
  diagnosis: [CD, UC]
  phenotype: [any]
  state: [flare]
severity: 2
hard: false
evidence_level: patient_reported  # guideline | trial | clinical_practice | patient_reported
recommendation_en: "During a flare, oily and fried foods are among the foods people with IBD most often report avoiding; choose lighter, less oily dishes."
recommendation_bn: "ফ্লেয়ারের সময় আইবিডি রোগীরা যেসব খাবার সবচেয়ে বেশি এড়িয়ে চলেন বলে জানান, তার মধ্যে তৈলাক্ত ও ভাজা খাবার আছে; হালকা, কম তেলের খাবার বেছে নিন।"
sources:  # quotes are exact sentences from the retrieved text (reference markers omitted); empty quote = identity verified only
  - key: GODALA2023
    citation: "Godala M, et al. Dietary Behaviors and Beliefs in Patients with Inflammatory Bowel Disease. J Clin Med. 2023."
    doi: "10.3390/jcm12103455"
    pmid: "37240560"
    licence: "CC BY 4.0 (open access, Europe PMC)"
    quote: "In a study by Marsh et al., participants most frequently reported avoiding spicy foods (46%), lactose-containing foods (41%), deep-fried/fatty foods (39%) and alcohol (38%) during active disease and spicy foods (39%) and lactose-containing foods (39%) during remission."
  - key: MORTON2020
    citation: "Morton H, et al. Inflammatory Bowel Disease: Are Symptoms and Diet Linked? Nutrients. 2020."
    doi: "10.3390/nu12102975"
    pmid: "33003341"
    licence: "CC BY 4.0 (open access, Europe PMC)"
    quote: "Commonly identified foods include fruit and vegetables, dairy products, spicy foods, processed foods, nuts and seeds, alcohol, and foods with a high fat content."
  - key: LIMDI2016
    citation: "Limdi JK, Aggarwal D, McLaughlin JT. Dietary Practices and Beliefs in Patients with Inflammatory Bowel Disease. Inflamm Bowel Dis. 2016."
    doi: "10.1097/mib.0000000000000585"
    pmid: "26383912"
    licence: "Not open access: short quotation from the published abstract; full text not retrieved"
    quote: "Worsening symptoms with certain foods was reported by 60%."
