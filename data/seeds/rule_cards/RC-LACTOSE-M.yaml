recommendation_en: "If you are lactose intolerant, keep milk-rich dishes small or choose lactose-free options; dairy only needs limiting if it bothers you."
recommendation_bn: "ল্যাকটোজ সহ্য না হলে দুধ-প্রধান খাবার অল্প খান বা ল্যাকটোজমুক্ত বিকল্প নিন; সমস্যা না হলে দুধ বাদ দেওয়ার দরকার নেই।"
