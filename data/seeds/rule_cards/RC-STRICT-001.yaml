id: RC-STRICT-001
title_en: "Stricturing Crohn's: avoid tough insoluble fibre"
title_bn: "স্ট্রিকচারিং ক্রোনস: শক্ত অদ্রবণীয় আঁশ এড়িয়ে চলুন"  # native-speaker review needed
component: insoluble_fibre
min_level: medium
